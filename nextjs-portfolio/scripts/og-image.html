<!doctype html>
<!--
  Source for public/og.jpg, the 1200x630 social-preview card.
  To regenerate after editing: open this file in Chrome/Edge, DevTools > device toolbar,
  set 1200 x 630, then "Capture screenshot" and save it as PNG, then convert to public/og.jpg (keep it under ~300 KB for WhatsApp).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: "Geist", sans-serif;
        background: #18181b url("../public/images/nebula_1.png") -380px -420px / 1940px auto no-repeat;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 96px;
      }
      /* Darken the left side so the text always reads */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(90deg, rgb(24 24 27 / 0.92) 35%, rgb(24 24 27 / 0.35));
      }
      main, img { position: relative; }
      .domain { font-size: 30px; font-weight: 600; color: #a1a1aa; }
      h1 { margin-top: 28px; font-size: 84px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
      .role { margin-top: 24px; font-size: 44px; font-weight: 800; letter-spacing: -0.02em; color: #22d3ee; }
      .line { margin-top: 28px; font-size: 28px; color: #d4d4d8; }
      img {
        width: 300px;
        height: 300px;
        border-radius: 50%;
        object-fit: cover;
        border: 6px solid #06b6d4;
        padding: 8px;
        background: #18181b;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="domain">jnisperos.space</p>
      <h1>Jeric Nisperos</h1>
      <p class="role">Software &amp; Support Engineer</p>
      <p class="line">Building web apps and AI agents.</p>
    </main>
    <img src="../public/profile.jpg" alt="" />
  </body>
</html>
